<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #3191ff 0%, #3191ff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Panel de registro de tareas */
        .form-panel {
            flex: 1;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .form-panel h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
            border-bottom: 3px solid #3191ff;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .suggestions {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-top: 5px;
        }

        .suggestion-item {
            padding: 8px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background: #3191ff;
            color: white;
        }

        .time-options {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }

        .time-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn {
            background: linear-gradient(135deg, #3191ff 0%, #3191ff 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Panel de tareas registradas */
        .tasks-panel {
            flex: 1;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }

        .tasks-panel h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
            border-bottom: 3px solid #3191ff;
            padding-bottom: 10px;
        }

        .task-card {
            background: #f8f9fa;
            border-left: 5px solid #3191ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .task-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .task-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .task-time {
            color: #3191ff;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .task-email {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .task-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 8px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-notified {
            background: #d1ecf1;
            color: #0c5460;
        }

        .delete-btn {
            float: right;
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Panel Izquierdo - Registro de Tareas -->
        <div class="form-panel">
            <h2>Registrar Nueva Tarea</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskSelect"> Seleccionar Tarea:</label>
                    <select id="taskSelect" required>
                        <option value="">Selecciona una tarea...</option>
                        <option value="ordeñar"> Ordeñar</option>
                        <option value="alimentar"> Alimentar ganado</option>
                        <option value="limpiar"> Limpiar establo</option>
                        <option value="revisar"> Revisión veterinaria</option>
                        <option value="pastoreo"> Llevar a pastoreo</option>
                        <option value="vacunar"> Vacunar</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="taskDetail"> Especificaciones:</label>
                    <input type="text" id="taskDetail" placeholder="Ejemplo: Potrero 1, Animal Tal" required>
                    <div class="suggestions" id="suggestions" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <label> Configuración de hora:</label>
                    <div class="time-options">
                        <div class="time-option">
                            <input type="radio" name="timeType" id="autoTime" value="auto" checked>
                            <label for="autoTime">Automática (actual)</label>
                        </div>
                        <div class="time-option">
                            <input type="radio" name="timeType" id="manualTime" value="manual">
                            <label for="manualTime">Manual</label>
                        </div>
                    </div>
                    <input type="datetime-local" id="manualDateTime" style="display: none;">
                </div>

                <div class="form-group">
                    <label for="email">📧 Correo para recordatorio:</label>
                    <input type="email" id="email" placeholder="ejemplo@gmail.com" required>
                    <small style="color: #666;">Recibirás un correo 5 minutos antes de la tarea</small>
                </div>

                <button type="submit" class="btn"> Registrar Tarea</button>
            </form>
        </div>

        <!-- Panel Derecho - Tareas Registradas -->
        <div class="tasks-panel">
            <h2> Tareas Programadas</h2>
            <div id="tasksList"></div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Sugerencias según el tipo de tarea
        const suggestionsMap = {
            'ordeñar': ['Lote 1 - 50 vacas', 'Lote 2 - 45 vacas', 'Lote 3 - 40 vacas', 'Lote 4 - 35 vacas'],
            'alimentar': ['Corral Norte', 'Corral Sur', 'Corral Este', 'Corral Oeste', 'Terneros'],
            'limpiar': ['Establo Principal', 'Sala de ordeño', 'Corrales exteriores', 'Comederos'],
            'revisar': ['Vacas preñadas', 'Terneros recién nacidos', 'Vacas en producción', 'Toros'],
            'pastoreo': ['Potrero 1', 'Potrero 2', 'Potrero 3', 'Potrero Norte'],
            'vacunar': ['Terneros menores', 'Vacas adultas', 'Todo el ganado', 'Lote específico']
        };

        let tasks = JSON.parse(localStorage.getItem('ganaderiaTasks')) || [];

        // Mostrar sugerencias
        document.getElementById('taskSelect').addEventListener('change', function() {
            const suggestions = suggestionsMap[this.value] || [];
            const suggestionsDiv = document.getElementById('suggestions');
            
            if (suggestions.length > 0) {
                suggestionsDiv.innerHTML = suggestions.map(s => 
                    `<div class="suggestion-item" onclick="selectSuggestion('${s}')">${s}</div>`
                ).join('');
                suggestionsDiv.style.display = 'block';
            } else {
                suggestionsDiv.style.display = 'none';
            }
        });

        function selectSuggestion(text) {
            document.getElementById('taskDetail').value = text;
            document.getElementById('suggestions').style.display = 'none';
        }

        // Toggle hora manual/automática
        document.querySelectorAll('input[name="timeType"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const manualInput = document.getElementById('manualDateTime');
                manualInput.style.display = this.value === 'manual' ? 'block' : 'none';
                if (this.value === 'manual') {
                    const now = new Date();
                    now.setMinutes(now.getMinutes() + 30);
                    manualInput.value = now.toISOString().slice(0, 16);
                }
            });
        });

        // Enviar formulario
        document.getElementById('taskForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const taskType = document.getElementById('taskSelect');
            const taskDetail = document.getElementById('taskDetail');
            const email = document.getElementById('email');
            const timeType = document.querySelector('input[name="timeType"]:checked').value;
            
            let taskTime;
            if (timeType === 'auto') {
                taskTime = new Date();
            } else {
                taskTime = new Date(document.getElementById('manualDateTime').value);
            }
            
            const task = {
                id: Date.now(),
                type: taskType.options[taskType.selectedIndex].text,
                detail: taskDetail.value,
                time: taskTime.toISOString(),
                email: email.value,
                status: 'pending',
                notified: false
            };
            
            tasks.push(task);
            saveTasks();
            displayTasks();
            
            // Enviar datos al servidor
            try {
                await fetch('/api/register-task', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(task)
                });
                showNotification('Tarea registrada exitosamente');
            } catch (error) {
                console.error('Error:', error);
                showNotification('Tarea guardada localmente');
            }
            
            this.reset();
            document.getElementById('suggestions').style.display = 'none';
            document.getElementById('manualDateTime').style.display = 'none';
        });

        function displayTasks() {
            const tasksList = document.getElementById('tasksList');
            tasksList.innerHTML = tasks.map(task => {
                const taskTime = new Date(task.time);
                const timeString = taskTime.toLocaleString('es-ES', {
                    hour: '2-digit',
                    minute: '2-digit',
                    day: '2-digit',
                    month: '2-digit'
                });
                
                return `
                    <div class="task-card">
                        <button class="delete-btn" onclick="deleteTask(${task.id})">❌</button>
                        <div class="task-title">${task.type}</div>
                        <div class="task-detail">${task.detail}</div>
                        <div class="task-time">🕐 ${timeString}</div>
                        <div class="task-email">📧 ${task.email}</div>
                        <span class="task-status ${task.notified ? 'status-notified' : 'status-pending'}">
                            ${task.notified ? '📨 Notificado' : '⏳ Pendiente'}
                        </span>
                    </div>
                `;
            }).join('');
            
            checkUpcomingTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            displayTasks();
            showNotification('Tarea eliminada');
        }

        function saveTasks() {
            localStorage.setItem('ganaderiaTasks', JSON.stringify(tasks));
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        function checkUpcomingTasks() {
            const now = new Date();
            tasks.forEach(task => {
                if (!task.notified) {
                    const taskTime = new Date(task.time);
                    const timeDiff = taskTime - now;
                    const fiveMinutes = 5 * 60 * 1000;
                    
                    if (timeDiff > 0 && timeDiff <= fiveMinutes) {
                        sendReminder(task);
                    }
                }
            });
        }

        async function sendReminder(task) {
            try {
                await fetch('/api/send-reminder', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(task)
                });
                task.notified = true;
                saveTasks();
                displayTasks();
                showNotification(`Recordatorio enviado para: ${task.type}`);
            } catch (error) {
                console.error('Error enviando recordatorio:', error);
            }
        }

        // Verificar cada minuto
        setInterval(checkUpcomingTasks, 60000);
        
        // Inicializar
        displayTasks();
    </script>
</body>
</html>
